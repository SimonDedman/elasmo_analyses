<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharkOracle</title>
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a333f;
    --ink:#e6edf3; --dim:#9aa7b4; --accent:#3fb6d3; --accent2:#2b7fa6;
    --green:#2ea043; --amber:#d29922; --grey:#6e7681; --red:#da3633;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px;
           background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header .logo { height:36px; width:auto; background:#fff; border-radius:6px; padding:3px 6px; display:block; }
  header h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:.2px; }
  header h1 span { color:var(--accent); }
  .status { margin-left:auto; font-size:12px; color:var(--dim); text-align:right; min-width:230px; }
  .bar { height:5px; background:var(--panel2); border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar > i { display:block; height:100%; background:var(--accent); width:0; transition:width .6s; }
  .layout { display:grid; grid-template-columns:320px 1fr; gap:0; height:calc(100vh - 54px); }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:14px; }
  main { overflow-y:auto; padding:22px 26px; }
  .fam { border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--panel2); }
  .fam > summary { cursor:pointer; padding:9px 11px; font-weight:600; font-size:13px;
                   list-style:none; display:flex; align-items:center; gap:8px; }
  .fam > summary::-webkit-details-marker { display:none; }
  .fam > summary .chev { color:var(--dim); transition:transform .2s; }
  .fam[open] > summary .chev { transform:rotate(90deg); }
  .fam .badge { margin-left:auto; font-size:11px; color:var(--bg); background:var(--accent);
                border-radius:10px; padding:1px 7px; font-weight:700; display:none; }
  .fam .body { padding:4px 11px 11px; }
  .search { width:100%; padding:6px 8px; margin-bottom:6px; background:var(--bg);
            border:1px solid var(--line); border-radius:6px; color:var(--ink); }
  .opts { max-height:220px; overflow-y:auto; }
  label.opt { display:flex; align-items:center; gap:7px; padding:2px 0; font-size:13px; cursor:pointer; }
  label.opt .cnt { margin-left:auto; color:var(--dim); font-size:11px; }
  .range { display:flex; gap:8px; align-items:center; }
  .range input { width:100%; padding:6px; background:var(--bg); border:1px solid var(--line);
                 border-radius:6px; color:var(--ink); }
  .note { font-size:11px; color:var(--amber); margin:4px 0 2px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .chip { background:var(--accent2); color:#fff; border-radius:12px; padding:2px 9px; font-size:12px;
          display:flex; gap:6px; align-items:center; }
  .chip b { cursor:pointer; }
  .qbar { display:flex; gap:10px; margin-bottom:8px; }
  .qbar input { flex:1; padding:12px 14px; font-size:15px; background:var(--panel); color:var(--ink);
                border:1px solid var(--line); border-radius:9px; }
  .qbar button { padding:0 22px; font-size:15px; font-weight:650; background:var(--accent); color:#04222c;
                 border:none; border-radius:9px; cursor:pointer; }
  .qbar button:disabled { opacity:.5; cursor:default; }
  .examples { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .ex { font-size:12.5px; color:var(--ink); background:var(--panel2); border:1px solid var(--line);
        border-radius:16px; padding:5px 12px; cursor:pointer; transition:.15s; }
  .ex:hover { border-color:var(--accent); color:var(--accent); }
  .meta { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .answer { background:var(--panel); border:1px solid var(--line); border-radius:11px;
            padding:18px 20px; font-size:15px; line-height:1.65; margin-bottom:8px; }
  .answer a.cite { color:var(--accent); text-decoration:none; font-weight:600; white-space:nowrap; }
  .sup { font-size:12px; font-weight:700; cursor:help; }
  .strength { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:650;
              padding:5px 12px; border-radius:20px; margin-bottom:18px; }
  .dot { width:9px; height:9px; border-radius:50%; }
  .src { border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:8px;
         padding:11px 14px; margin-bottom:9px; background:var(--panel); }
  .src h4 { margin:0 0 3px; font-size:14px; }
  .src .sm { color:var(--dim); font-size:12px; }
  .src .prev { margin-top:6px; font-size:12.5px; color:#c4cfda; }
  .src .scores { float:right; font-size:11px; color:var(--dim); }
  .empty { color:var(--dim); padding:40px; text-align:center; }
  .spin { display:inline-block; width:15px; height:15px; border:2px solid var(--line);
          border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px;}
  .hist { margin:0 0 12px; font-size:12.5px; }
  .hist > summary { cursor:pointer; color:var(--dim); }
  .hist .h { padding:4px 8px; margin-top:4px; background:var(--panel2); border:1px solid var(--line);
             border-radius:6px; cursor:pointer; color:var(--ink); }
  .hist .h:hover { border-color:var(--accent); color:var(--accent); }
  .hist .h small { color:var(--dim); margin-left:6px; }
  .why { margin-top:8px; border-top:1px dashed var(--line); padding-top:6px; font-size:12.5px; }
  .why > summary { cursor:pointer; color:var(--accent); font-weight:600; }
  .why .row { margin:5px 0; color:#c4cfda; }
  .why .row b { color:var(--ink); }
  .why .tag { display:inline-block; padding:0 8px; border-radius:10px; font-size:11.5px; font-weight:650;
              background:var(--accent2); color:#fff; margin-right:4px; }
  .why .tag.kw { background:var(--green); } .why .tag.vec { background:var(--accent2); }
  .why .warn { color:var(--amber); }
  .why dl { margin:4px 0 0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; color:var(--dim); }
  .why dt { color:var(--ink); } .why dd { margin:0; }
  .why .full { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:6px;
               padding:8px 10px; margin-top:4px; max-height:320px; overflow-y:auto; color:#c4cfda; }
  .why mark { background:#d2992266; color:var(--ink); border-radius:3px; padding:0 1px; }
  .nomatch { background:#d2992218; border:1px solid #d2992255; color:var(--amber); border-radius:8px;
             padding:8px 12px; font-size:12.5px; margin:-8px 0 16px; }
  .xbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0 10px; padding:8px 10px;
          background:var(--panel2); border:1px solid var(--line); border-radius:8px; font-size:12.5px; }
  .xbar select, .xbar button { background:var(--bg); color:var(--ink); border:1px solid var(--line);
          border-radius:6px; padding:5px 10px; font-size:12.5px; cursor:pointer; }
  .xbar button:hover { border-color:var(--accent); color:var(--accent); }
  .xbar .sp { margin-left:auto; }
  .src .pick { float:left; margin:3px 8px 0 0; }
  .sortbar { font-size:11.5px; color:var(--dim); margin:2px 0 6px; }
  .sortbar select { background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:5px; font-size:11.5px; padding:1px 4px; }
  .qbar button.alt { background:var(--panel2); color:var(--ink); border:1px solid var(--line); font-size:13px; padding:0 14px; }
  .pager { display:flex; gap:10px; align-items:center; margin:10px 0; font-size:12.5px; }
  .pager button { background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--accent);
           color:#04222c; padding:8px 18px; border-radius:20px; font-weight:650; font-size:13px;
           opacity:0; pointer-events:none; transition:opacity .25s; z-index:20; }
  .toast.on { opacity:1; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<header>
  <img class="logo" src="/static/shark_oracle_logo_stacked.svg" alt="Shark Oracle" title="Shark Oracle">
  <div class="status" id="status">connecting…<div class="bar"><i id="barfill"></i></div></div>
</header>
<div class="layout">
  <aside id="filters"><div class="empty">loading filters…</div></aside>
  <main>
    <div class="qbar">
      <input id="q" placeholder="Ask a question, or leave blank and choose filters to list papers…"
             value="What techniques are used to determine age and growth in sharks?">
      <button id="go">Ask</button><button id="list" class="alt" title="List the papers matching the filters, no question needed">List papers</button>
    </div>
    <div class="examples" id="examples"></div>
    <details class="hist" id="hist"><summary>Recent questions</summary><div id="histlist"></div></details>
    <div class="meta" id="qmeta"></div>
    <div id="results"><div class="empty">Ask a question to search the corpus. Add filters on the left to narrow it.</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const state = { families:[], sel:{}, authors:{} };  // sel[key] -> Set or {min,max}; authors[id]=name

async function loadStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    const b = s.build || {};
    const tgt = b.target_papers || s.index_papers;
    const pct = tgt ? Math.round(100 * s.index_papers / tgt) : 0;
    $('#barfill').style.width = pct + '%';
    if (b.complete) $('#status').firstChild.textContent =
      `${s.index_papers.toLocaleString()} papers indexed`;
    else $('#status').firstChild.textContent =
      `indexing ${s.index_papers.toLocaleString()} / ${tgt.toLocaleString()} papers`;
  } catch(e) { $('#status').firstChild.textContent = 'server offline'; }
}

function famBadge(key){ const b=document.getElementById('badge-'+key); if(!b)return;
  const v=state.sel[key]; let n=0;
  if(v instanceof Set) n=v.size; else if(v && (v.min!=null||v.max!=null)) n=1;
  else if(key==='author') n=Object.keys(state.authors).length;
  b.style.display=n?'inline-block':'none'; b.textContent=n; }

function renderFilters(fams){
  state.families = fams;
  const host = $('#filters'); host.innerHTML='';
  fams.forEach((f,i)=>{
    const big = f.widget==='search-multiselect' || (f.options && f.options.length>14);
    const d=document.createElement('details'); d.className='fam'; d.open = i<3 && !big;
    const opts = f.options||[];
    d.innerHTML = `<summary><span class="chev">▸</span>${f.label}
        <span class="badge" id="badge-${f.key}"></span></summary><div class="body"></div>`;
    const body=d.querySelector('.body');
    if(f.note) body.insertAdjacentHTML('beforeend',`<div class="note">${esc(f.note)}</div>`);
    if(f.sorts && f.sorts.length>1) body.insertAdjacentHTML('beforeend',
      `<div class="sortbar">sort: <select data-sort="${f.key}">${f.sorts.map(x=>`<option value="${x.id}"${x.id===f.default_sort?' selected':''}>${x.label}</option>`).join('')}</select></div>`);

    if(f.kind==='author'){
      body.insertAdjacentHTML('beforeend',
        `<input class="search" id="au-in" placeholder="type an author name…">
         <div id="au-sug" class="opts"></div><div class="chips" id="au-chips"></div>`);
    } else if(f.kind==='range'){
      const mn=f.min!=null?Math.floor(f.min):'', mx=f.max!=null?Math.ceil(f.max):'';
      body.insertAdjacentHTML('beforeend',
        `<div class="range"><input type="number" placeholder="min ${mn}" data-k="${f.key}" data-b="min">
         <span>–</span><input type="number" placeholder="max ${mx}" data-k="${f.key}" data-b="max"></div>`);
    } else {
      if(big) body.insertAdjacentHTML('beforeend',
        `<input class="search" placeholder="filter ${opts.length} options…" data-f="${f.key}">`);
      const wrap=document.createElement('div'); wrap.className='opts'; wrap.id='opts-'+f.key;
      opts.forEach(o=>{
        const l=document.createElement('label'); l.className='opt';
        l.dataset.lab=(o.label||'').toLowerCase();
        l.innerHTML=`<input type="checkbox" value="${o.value}"><span>${o.label}</span><span class="cnt">${o.count??''}</span>`;
        wrap.appendChild(l);
      });
      body.appendChild(wrap);
      if(f.sorts) sortOpts(f.key, f.default_sort);
    }
    host.appendChild(d);
  });
  wireFilters();
}

function sortOpts(key, mode){
  const f=state.families.find(x=>x.key===key), wrap=document.getElementById('opts-'+key); if(!wrap||!f) return;
  const info={}; (f.options||[]).forEach(o=>info[o.value]=o);
  const rows=[...wrap.children];
  const val=l=>l.querySelector('input').value;
  const az=(a,b)=>(info[val(a)].label).localeCompare(info[val(b)].label);
  rows.sort((a,b)=>{ const A=info[val(a)], B=info[val(b)];
    if(mode==='az') return az(a,b);
    if(mode==='geo'||mode==='best') return (A.rank-B.rank)||az(a,b);
    return (B.count-A.count)||az(a,b); });
  rows.forEach(r=>wrap.appendChild(r));
}
function wireFilters(){
  $('#filters').addEventListener('change', e=>{
    if(e.target.matches('select[data-sort]')) sortOpts(e.target.dataset.sort, e.target.value);
  });
  $('#filters').addEventListener('change', e=>{
    const cb=e.target;
    if(cb.matches('.opts input[type=checkbox]')){
      const key=cb.closest('.fam').querySelector('.badge').id.replace('badge-','');
      state.sel[key]=state.sel[key]||new Set();
      cb.checked?state.sel[key].add(cb.value):state.sel[key].delete(cb.value);
      if(!state.sel[key].size) delete state.sel[key];
      famBadge(key);
    }
    if(cb.matches('input[type=number]')){
      const k=cb.dataset.k; state.sel[k]=state.sel[k]||{min:null,max:null};
      state.sel[k][cb.dataset.b]= cb.value===''?null:parseFloat(cb.value);
      if(state.sel[k].min==null&&state.sel[k].max==null) delete state.sel[k];
      famBadge(k);
    }
  });
  $('#filters').addEventListener('input', e=>{
    if(e.target.matches('.search[data-f]')){
      const f=e.target.dataset.f, n=e.target.value.toLowerCase();
      document.querySelectorAll('#opts-'+f+' .opt').forEach(l=>
        l.style.display=l.dataset.lab.includes(n)?'':'none');
    }
    if(e.target.id==='au-in') authorSuggest(e.target.value);
  });
}

let auTimer;
function authorSuggest(qv){
  clearTimeout(auTimer);
  if(qv.trim().length<2){ $('#au-sug').innerHTML=''; return; }
  auTimer=setTimeout(async()=>{
    const r=await (await fetch('/api/authors?q='+encodeURIComponent(qv))).json();
    $('#au-sug').innerHTML = r.suggestions.map(s=>
      `<label class="opt" data-id="${s.id}" data-nm="${s.display_name.replace(/"/g,'')}">
        <span>${s.display_name}</span><span class="cnt">${s.paper_count}</span></label>`).join('');
  },180);
}
document.addEventListener('click', e=>{
  const l=e.target.closest('#au-sug .opt');
  if(l){ state.authors[l.dataset.id]=l.dataset.nm; $('#au-in').value=''; $('#au-sug').innerHTML='';
         renderAuChips(); famBadge('author'); }
  const rm=e.target.closest('#au-chips .chip b');
  if(rm){ delete state.authors[rm.dataset.id]; renderAuChips(); famBadge('author'); }
});
function renderAuChips(){ const c=$('#au-chips'); if(!c)return;
  c.innerHTML=Object.entries(state.authors).map(([id,nm])=>
    `<span class="chip">${nm}<b data-id="${id}">✕</b></span>`).join(''); }

function collectFilters(){
  const out={};
  for(const [k,v] of Object.entries(state.sel)){
    if(v instanceof Set) out[k]=[...v];
    else out[k]=v;
  }
  const au=Object.keys(state.authors); if(au.length) out.author=au;
  return out;
}

const STR = {'well-supported':'--green','contested':'--red','limited':'--amber','unresolved':'--grey','':'--grey'};
const SUP = {entailed:['\u2713','--green'],neutral:['\u223c','--amber'],contradicted:['\u2717','--red'],uncited:['?','--grey']};
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function renderSentences(sents, srcById){
  return sents.map(x=>{
    const m=SUP[x.support]||SUP.uncited;
    let tip=x.support;
    if(x.best_support_id!=null) tip+=' \u00b7 supported by '+x.best_support_id;
    if((x.contradicted_by||[]).length) tip+=' \u00b7 contradicted by '+x.contradicted_by.join(', ');
    return linkifyCitations(esc(x.text),srcById)+` <span class="sup" style="color:var(${m[1]})" title="${esc(tip)}">${m[0]}</span>`;
  }).join(' ');
}
function citeLabel(s){
  const first=(s.authors||'').split('&')[0].trim();
  const surname=(first.split(',')[0].trim())||(s.authors||'')||'?';
  const etal=(s.authors||'').includes('&')?' et al':'';
  const yr=s.year!=null?String(s.year).replace(/\.0$/,''):'';
  return `${surname}${etal}${yr?', '+yr:''}: ${s.title||''}`;
}
function linkifyCitations(text, srcById){
  // Handles single [123] and grouped [1, 2, 3] citation blocks — each id
  // becomes its own blue, hoverable link; brackets/commas stay plain.
  return text.replace(/\[([\d\s,]+)\]/g, (m, inner)=>{
    const ids = inner.split(',').map(s=>s.trim()).filter(s=>/^\d+$/.test(s));
    if(!ids.length) return m;
    const links = ids.map(id=>{
      const t=(srcById[id]||('paper '+id)).replace(/"/g,'');
      return `<a class="cite" href="#src-${id}" title="${t}">${id}</a>`;
    });
    return '[' + links.join(', ') + ']';
  });
}

// Access token (only needed when the server runs with RAG_AUTH_MODE=token).
function getToken(){ try { return localStorage.getItem('so_token')||''; } catch(e){ return ''; } }
function setToken(t){ try { localStorage.setItem('so_token',t); } catch(e){} }
async function apiFetch(url, opts={}){
  const go = () => { const h=Object.assign({}, opts.headers||{}); const t=getToken();
                     if(t) h['Authorization']='Bearer '+t; return fetch(url, Object.assign({}, opts, {headers:h})); };
  let r = await go();
  if(r.status===401){
    const t = prompt('This server needs an access token:');
    if(t){ setToken(t.trim()); r = await go(); }
  }
  return r;
}
async function loadHistory(){
  try {
    const r = await apiFetch('/api/history?limit=15'); if(!r.ok) return;
    const d = await r.json(); const box=$('#histlist'); box.innerHTML='';
    (d.queries||[]).forEach(h=>{
      const el=document.createElement('div'); el.className='h'; el.textContent=h.question;
      const sm=document.createElement('small'); sm.textContent=new Date(h.ts*1000).toLocaleString();
      el.appendChild(sm); el.onclick=()=>{ $('#q').value=h.question; ask(); }; box.appendChild(el);
    });
    if(!(d.queries||[]).length) box.innerHTML='<div class="meta">none yet</div>';
  } catch(e){}
}


const EXP_FORMATS=[['bibtex','BibTeX'],['ris','RIS (EndNote, Zotero, Mendeley)'],['apa','APA 7'],['harvard','Harvard'],
  ['vancouver','Vancouver'],['chicago','Chicago (author-date)'],['mla','MLA'],['csv','CSV'],['json','JSON']];
const STYLE_FMTS=['apa','harvard','vancouver','chicago','mla'];
let LAST={answer:null};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t);
  toast.t=setTimeout(()=>t.classList.remove('on'),1800); }
function selectedIds(){ return [...document.querySelectorAll('.pick:checked')].map(c=>c.value); }
async function fetchRefs(fmt){
  const ids=selectedIds(); if(!ids.length){ toast('Select at least one source'); return null; }
  const r=await apiFetch('/api/export?ids='+ids.join(',')+'&fmt='+fmt);
  if(!r.ok){ toast('Export failed ('+r.status+')'); return null; }
  return r.text();
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); }
  catch(e){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select();
            document.execCommand('copy'); a.remove(); }
}
async function exportCopy(){ const t=await fetchRefs($('#xfmt').value); if(t==null) return;
  await copyText(t); toast('Copied '+selectedIds().length+' references'); }
async function exportDownload(){ const fmt=$('#xfmt').value; const t=await fetchRefs(fmt); if(t==null) return;
  const ext={bibtex:'bib',ris:'ris',csv:'csv',json:'json'}[fmt]||'txt';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));
  a.download='shark_oracle_references_'+fmt+'.'+ext; document.body.appendChild(a); a.click(); a.remove(); }
async function exportAnswer(){
  const fmt=STYLE_FMTS.includes($('#xfmt').value)?$('#xfmt').value:'apa';
  const refs=await fetchRefs(fmt); if(refs==null) return;
  const ans=(LAST.answer||'').trim();
  await copyText((ans?ans+'\n\n':'')+'References ('+fmt.toUpperCase()+')\n'+refs.trim());
  toast('Copied answer with references'+(STYLE_FMTS.includes($('#xfmt').value)?'':' (APA)')); }
function termRegex(terms){
  const stem=w=>{ w=w.toLowerCase(); for(const suf of ['ing','ed','es','s']) if(w.endsWith(suf)&&w.length-suf.length>=3) return w.slice(0,-suf.length); return w; };
  const parts=(terms||[]).map(t=>t.split(/\W+/).filter(Boolean).map(w=>'\\b'+stem(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*').join('\\W+')).filter(Boolean);
  return parts.length?new RegExp('('+parts.join('|')+')','gi'):null;
}
function highlight(text, terms){
  const re=termRegex(terms); const e=esc(text); if(!re) return e;
  return e.replace(re,'<mark>$1</mark>');
}
function whyHtml(s){
  const w=s.why; if(!w) return '';
  const ch=w.channels||[]; const kw=ch.includes('fts'), vec=ch.includes('vector');
  const chTxt=(kw?'<span class="tag kw">keyword match</span>':'')+(vec?'<span class="tag vec">semantic similarity</span>':'');
  const how = kw&&vec?'found by both channels':kw?'found by the keyword search only':'found by meaning only (no keyword hit)';
  const terms=w.matched_terms||[];
  const termRow = terms.length
    ? `Query words in this passage: ${terms.map(t=>'<mark>'+esc(t)+'</mark>').join(', ')}`
    : `<span class="warn">No query word occurs in this passage: matched on meaning only.</span>`;
  const ce=s.ce_score;
  const ceNote= ce==null?'':(ce<0?' <span class="warn">negative: the re-ranker thinks this passage is off-topic for the question</span>':'');
  return `<details class="why"><summary>Why this paper?</summary>
    <div class="row"><b>Channel:</b> ${chTxt} ${how}${w.retrieval==='vector'?' (keyword index unavailable)':''}</div>
    <div class="row">${termRow}</div>
    <dl><dt>cosine ${s.cosine_score}</dt><dd>semantic similarity between question and passage, 0 to 1 (higher is closer)</dd>
      ${ce!=null?`<dt>relevance ${ce}</dt><dd>cross-encoder score on question and passage together${ceNote}</dd>`:''}
      ${w.fused_rank!=null?`<dt>fused rank ${w.fused_rank}</dt><dd>position after combining keyword and semantic rankings, before re-ranking${w.fts_score!=null?'; keyword (BM25) score '+w.fts_score:''}</dd>`:''}</dl>
    <details style="margin-top:6px"><summary style="cursor:pointer;color:var(--dim)">Show the retrieved passage in full</summary>
      <div class="full">${highlight(w.passage||'',terms)}</div></details></details>`;
}

function hasFilters(){ return Object.keys(collectFilters()).length>0; }
function exportBarHtml(){
  return `<div class="xbar"><span>Export</span>
        <select id="xfmt">${EXP_FORMATS.map(f=>`<option value="${f[0]}">${f[1]}</option>`).join('')}</select>
        <button id="xcopy">Copy to clipboard</button><button id="xdl">Download</button>
        <label style="margin-left:8px"><input type="checkbox" id="selall" checked> select all on this page</label>
        <button class="sp" id="xans">Copy answer with references</button></div>`;
}
function wireExport(){
  if($('#xcopy')){ $('#xcopy').onclick=exportCopy; $('#xdl').onclick=exportDownload; $('#xans').onclick=exportAnswer; }
  if($('#selall')) $('#selall').onchange=e=>document.querySelectorAll('.pick').forEach(c=>c.checked=e.target.checked);
}
const BROWSE={page:1,sort:'year_desc'};
async function browse(page){
  if(!hasFilters()){ $('#qmeta').textContent='';
    $('#results').innerHTML='<div class="empty">Choose at least one filter on the left (or type a question) to list papers.</div>'; return; }
  BROWSE.page=page||1; LAST.answer=null;
  $('#go').disabled=true; $('#list').disabled=true;
  $('#results').innerHTML='<div class="empty"><span class="spin"></span> listing papers…</div>';
  let d;
  try { const resp=await apiFetch('/api/papers',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({filters:collectFilters(),page:BROWSE.page,page_size:50,sort:BROWSE.sort})});
        if(!resp.ok){ $('#results').innerHTML='<div class="empty">Could not list papers ('+resp.status+')</div>'; return; }
        d=await resp.json(); }
  catch(e){ $('#results').innerHTML='<div class="empty">request failed</div>'; return; }
  finally { $('#go').disabled=false; $('#list').disabled=false; }
  $('#qmeta').textContent='';
  const pager=`<div class="pager"><button class="pg" data-p="${d.page-1}"${d.page<=1?' disabled':''}>Previous</button>
      <span>page ${d.page} of ${d.pages}</span><button class="pg" data-p="${d.page+1}"${d.page>=d.pages?' disabled':''}>Next</button>
      <span style="margin-left:auto">sort: <select id="bsort">${[['year_desc','newest first'],['year_asc','oldest first'],['title','title A-Z']].map(x=>`<option value="${x[0]}"${x[0]===BROWSE.sort?' selected':''}>${x[1]}</option>`).join('')}</select></span></div>`;
  let html=`<div class="meta">${d.total.toLocaleString()} papers match these filters</div>`+exportBarHtml()+pager;
  html+=d.papers.map(s=>`<div class="src" id="src-${s.literature_id}">
      <input type="checkbox" class="pick" value="${s.literature_id}" checked title="include in export">
      <h4>[${s.literature_id}] ${esc(s.title||'(no title)')}</h4>
      <div class="sm">${esc((s.authors||'').replace(/\s*&\s*/g,', '))} · ${s.year||''} · ${esc(s.journal||'')}${s.doi?` · <a href="https://doi.org/${encodeURI(s.doi)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(s.doi)}</a>`:''}</div></div>`).join('')
      + (d.papers.length?pager:'');
  $('#results').innerHTML=html; wireExport();
  document.querySelectorAll('.pg').forEach(b=>b.onclick=()=>browse(parseInt(b.dataset.p)));
  document.querySelectorAll('#bsort').forEach(sel=>sel.onchange=()=>{ BROWSE.sort=sel.value; browse(1); });
}
async function ask(){
  const question=$('#q').value.trim();
  if(!question){ return browse(1); }
  $('#go').disabled=true;
  $('#results').innerHTML='<div class="empty"><span class="spin"></span> searching & generating…</div>';
  $('#qmeta').textContent='';
  const body={question, filters:collectFilters(), top_k:8, retrieve_n:30, generate:true};
  let r;
  try { const resp=await apiFetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)});
        if(resp.status===401){ $('#results').innerHTML='<div class="empty">Access token missing or wrong. Reload to try again.</div>';
          setToken(''); $('#go').disabled=false; return; }
        r=await resp.json(); }
  catch(e){ $('#results').innerHTML='<div class="empty">request failed</div>'; $('#go').disabled=false; return; }

  const srcById={}; (r.retrieved||[]).forEach(s=>srcById[s.literature_id]=citeLabel(s));
  const cs=r.claim_strength||{}; const col=`var(${STR[cs.label]||'--grey'})`;
  let mline=`mode: ${r.mode}`;
  if(r.n_papers_matching_filter!=null) mline+=` · ${r.n_papers_matching_filter.toLocaleString()} papers match filters`;
  $('#qmeta').textContent=mline;

  let html='';
  if(r.mode==='no-match'){
    html=`<div class="empty">No indexed papers match the selected filters yet.<br>
          (The index is still growing — try again shortly, or loosen filters.)</div>`;
  } else {
    if(r.answer) html+=`<div class="answer">${(r.sentences&&r.sentences.length)?renderSentences(r.sentences,srcById):linkifyCitations(r.answer,srcById)}</div>`;
    const isNLI = cs.basis==='entailment';
    html+=`<div class="strength" style="background:${col}22;color:${col};border:1px solid ${col}55">
             <span class="dot" style="background:${col}"></span>
             ${isNLI?'Sentence check (experimental): ':''}${(cs.label||'').toUpperCase()} — ${cs.reason||''}</div>`;
    const ct=r.claim_strength_topic;
    if(isNLI && ct && ct.label){
      const tcol=`var(${STR[ct.label]||'--grey'})`;
      html+=`<div class="strength" style="background:${tcol}22;color:${tcol};border:1px solid ${tcol}55;margin-top:6px">
               <span class="dot" style="background:${tcol}"></span>
               Topic coverage: ${ct.label.toUpperCase()} — ${ct.n_distinct_papers_retrieved||0} papers retrieved, ${ct.n_concordant_papers||0} strongly relevant</div>`;
    }
    const seen=new Set();
    const uniqSrc=(r.retrieved||[]).filter(s=>{ if(seen.has(s.literature_id))return false; seen.add(s.literature_id); return true; });
    LAST.answer=r.answer||null;
    const anyKw=uniqSrc.some(s=>((s.why||{}).matched_terms||[]).length);
    const ces=uniqSrc.map(s=>s.ce_score).filter(v=>v!=null);
    if(uniqSrc.length && !anyKw){
      const best=ces.length?Math.max(...ces):null;
      html+=`<div class="nomatch">None of your query words occur in any retrieved passage; these papers were matched on meaning only`+
            (best!=null&&best<0?`, and every relevance score is negative (best ${best.toFixed(2)}), so the re-ranker judges them off-topic. The corpus probably has nothing on this.`:'.')+`</div>`;
    }
    html+=`<div class="meta">${uniqSrc.length} source papers</div>
      <div class="xbar"><span>Export</span>
        <select id="xfmt">${EXP_FORMATS.map(f=>`<option value="${f[0]}">${f[1]}</option>`).join('')}</select>
        <button id="xcopy">Copy to clipboard</button><button id="xdl">Download</button>
        <button class="sp" id="xans">Copy answer with references</button></div><div>`+ uniqSrc.map(s=>`
      <div class="src" id="src-${s.literature_id}">
        <input type="checkbox" class="pick" value="${s.literature_id}" checked title="include in export">
        <span class="scores">cos ${s.cosine_score}${s.ce_score!=null?' · rel '+s.ce_score:''}</span>
        <h4>[${s.literature_id}] ${s.title||''}</h4>
        <div class="sm">${(s.authors||'').replace(/\s*&\s*/g,', ')} · ${s.year||''} · ${s.journal||''}</div>
        <div class="prev">${s.text_preview||''}</div>
        ${whyHtml(s)}
      </div>`).join('') + '</div>';
  }
  $('#results').innerHTML=html;
  if($('#xcopy')){ $('#xcopy').onclick=exportCopy; $('#xdl').onclick=exportDownload; $('#xans').onclick=exportAnswer; }
  $('#go').disabled=false;
  loadHistory();
}

$('#go').onclick=ask;
$('#list').onclick=()=>browse(1);
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter') ask(); });

const EXAMPLES = [
  "What methods are used to determine age and growth in sharks?",
  "How does bycatch in commercial fisheries affect elasmobranch populations?",
  "How is environmental DNA (eDNA) used to detect and monitor sharks?",
  "What do stable isotope analyses reveal about shark trophic ecology?",
  "How are acoustic telemetry and satellite tags used to track shark movement?",
  "What are the effects of climate change on the distribution of rays and skates?",
];
function renderExamples(){
  $('#examples').innerHTML = EXAMPLES.map(q=>`<span class="ex">${q}</span>`).join('');
  $('#examples').querySelectorAll('.ex').forEach(el=>el.onclick=()=>{
    $('#q').value = el.textContent; ask();
  });
}

// ?q=<question> asks on load (bookmarkable demo links; also used for screenshots)
function askFromUrl(){
  try { const q=new URLSearchParams(location.search).get('q'); if(q){ $('#q').value=q; ask(); } } catch(e){}
}

(async function init(){
  renderExamples();
  loadHistory();
  await loadStatus();
  try { const f=await (await fetch('/api/filters')).json(); renderFilters(f.families); }
  catch(e){ $('#filters').innerHTML='<div class="empty">filters unavailable</div>'; }
  setInterval(loadStatus, 20000);
  askFromUrl();
})();
</script>
</body>
